<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Products</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/listing.js" type="module"></script>
</head>
<body>
  <div id="main-header"></div>
  <div id="breadcrumb" class="breadcrumb"></div>
  <main class="divider">
    <section class="products">
      
      <h1 class="listing-title">Products</h1>
     
      <label class="sort-label" for="sort-products">Sort by:</label>
      <select id="sort-products" class="sort-products">
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
      </select>
      <ul class="product-list"></ul>
    </section>
  </main>
  <div id="main-footer"></div>
</body>
</html>
